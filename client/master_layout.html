<head>
  <title>DTube</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" type="image/png" href="DTube_files/images/dtubefavicon.png"/>
  <meta name="description" content="DTube, alternative decentralized video platform."/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.css">
</head>
<template name="masterLayout">
  <!-- Topbar isolated at the root level to prevent sidebar interference -->
  <div id="app-topbar-container" class="fixed" style="position: fixed; top: 0; left: 0; right: 0; z-index: 9999; transform: none !important;">
    {{#if isOnMobile }}
      {{> mobiletopbar}}
    {{else}}
      {{> topbar}}
    {{/if}}
  </div>

  {{> pusher}}
</template>
