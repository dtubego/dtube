<template name="mobiletopbar">
    {{#if isSearchingMobile}}
        {{> mobilesearch}}
    {{else}}
        <div id="dtube-mobile-topbar" class="ui large borderless main menu fixed dtube-topbar mobiletopbar" style="width:100%;">
            <div style="display: flex; align-items: center;">
                {{#if scot}}
                    <div class="ui sidebartoggleicon item needsclick" style="cursor: pointer; padding: 0 10px;">
                      <img class="sidebar icon needsclick" alt="" style="width:24px; height: 24px;" src="https://about.d.tube/img/kit/Logo_Black_D.svg" >
                    </div>
                    <a href='/' class="blacklogo ui header tiny item mobilelogoheader" id='textlogo' style="padding: 0 5px;">
                      <img  alt="" style="width:90px;" src="{{scot.logo}}" >
                    </a>
                    <a href='/' class="whitelogo ui header tiny item mobilelogoheader dsp-non" id='textlogo' style="padding: 0 5px;">
                      <img  alt="" style="width:90px;" src="{{scot.logonight}}" >
                    </a>
                {{else}}
                    <div class="ui sidebartoggleicon item needsclick" style="cursor: pointer; padding: 0 10px; display: flex; align-items: center;">
                        <i class="sidebar icon" style="font-size: 1.5em; margin: 0;"></i>
                    </div>
                    {{#if isLargeEnoughForLogo}}
                    <a href='/' class="blacklogo ui header tiny item mobilelogoheader" id='textlogo' style="padding: 0 5px;">
                        <img  alt="" style="width:90px;" src="{{settings.logo}}" >
                    </a>
                    <a href='/' class="whitelogo ui header tiny item mobilelogoheader dsp-non" id='textlogo' style="padding: 0 5px;">
                        <img  alt="" style="width:90px;" src="{{settings.logonight}}" >
                    </a>
                    {{else}}{{#if isLargeEnoughForMiniLogo}}
                    <a href='/' class="blacklogo ui header tiny item mobilelogoheader" id='textlogo' style="padding: 0 5px;">
                        <img  alt="" style="width:32px;" src="{{settings.logosmall}}" >
                    </a>
                    <a href='/' class="whitelogo ui header tiny item mobilelogoheader dsp-non" id='textlogo' style="padding: 0 5px;">
                        <img  alt="" style="width:32px;" src="{{settings.logosmallnight}}" >
                    </a>
                    {{/if}}{{/if}}
                {{/if}}
            </div>
            
            <div class="ui noshadow grid small menu" style="display: flex; align-items: center; margin: 0; box-shadow: none; border: none;">
                <div id="mobilesearchbis" class="ui item" style="padding: 0 10px; cursor: pointer;">
                    <i class="search icon" style='font-size: 1.5em; margin: 0;'></i>
                </div>
                {{#if isLoggedOn}}
                    {{> notificationdropdown}}
                {{/if}}
                <div class="ui item" style="padding: 0 10px;">
                    <a href="/login" class="circular ui icon youtube button" style="margin: 0;">
                        <i class="user icon" style='margin:0; padding:0px;'></i>
                    </a>
                </div>
            </div>
        </div>
    {{/if}}
</template>
